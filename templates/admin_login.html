<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login</title>
<style>
body { font-family: Arial; text-align: center; background: #f8f8f8; padding-top: 80px; }
.container { background: white; width: 320px; margin: 0 auto; padding: 25px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
input { padding: 8px; width: 80%; margin: 10px 0; }
button { padding: 10px 20px; background: #003366; color: white; border: none; border-radius: 5px; cursor: pointer; }
ul { color: red; list-style: none; padding: 0; }
</style>
</head>
<body>
    <div class="container">
        <h2>Admin Login</h2>
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <ul>
            {% for message in messages %}
              <li>{{ message }}</li>
            {% endfor %}
            </ul>
          {% endif %}
        {% endwith %}
        <form method="POST">
            <input type="password" name="password" placeholder="Admin password" required>
            <br>
            <button type="submit">Log In</button>
        </form>
    </div>
</body>
</html>
