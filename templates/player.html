{% extends "base.html" %}
{% block title %}Player Registration - NPL{% endblock %}
{% block content %}
  <div class="page-header">
    <h1>Player Registration</h1>
    <p>Step up to the crease — register to be part of the auction pool.</p>
  </div>

  <div class="container">
    <form action="/player" method="post" enctype="multipart/form-data">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" name="name" id="name" placeholder="Enter your full name" required>
      </div>

      <div class="field">
        <label>Role</label>
        <div class="role-group">
          <input type="radio" name="role" id="batsman" value="batsman" required>
          <label for="batsman">🏏 Batsman</label>

          <input type="radio" name="role" id="bowler" value="bowler">
          <label for="bowler">🎯 Bowler</label>

          <input type="radio" name="role" id="all-rounder" value="all-rounder">
          <label for="all-rounder">⚡ All-Rounder</label>

          <input type="radio" name="role" id="wicketkeeper" value="wicketkeeper">
          <label for="wicketkeeper">🧤 WicketKeeper</label>
        </div>
      </div>

      <div class="field">
        <label>Photo</label>
        <div class="file-upload">
          <input type="file" name="photo" id="photo" accept="image/*" required
                 onchange="document.getElementById('photoLabel').textContent = this.files[0] ? this.files[0].name : 'Tap to upload your photo';">
          <div class="file-upload-label" id="photoLabel">
            <span class="file-icon">📷</span> Tap to upload your photo
          </div>
        </div>
      </div>

      <button type="submit">Register</button>
    </form>

    <a href="/" class="back-link">← Back to Home</a>
  </div>
{% endblock %}
