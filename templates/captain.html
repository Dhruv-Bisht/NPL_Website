{% extends "base.html" %}
{% block title %}Team Registration - NPL{% endblock %}
{% block content %}
  <div class="page-header">
    <h1>Team Registration</h1>
    <p>Bring your squad to the auction table.</p>
  </div>

  <div class="container">
    <form action="/captain" method="POST" enctype="multipart/form-data">
      <div class="field">
        <label for="team_name">Team Name</label>
        <input type="text" name="team_name" id="team_name" placeholder="Enter team name" required>
      </div>

      <div class="field">
        <label for="phone">Phone Number</label>
        <input type="text" name="phone" id="phone" placeholder="Enter contact number" required>
      </div>

      <div class="field">
        <label for="captain">Captain Name</label>
        <input type="text" name="captain" id="captain" placeholder="Enter captain's name" required>
      </div>

      <div class="field">
        <label>Team Logo</label>
        <div class="file-upload">
          <input type="file" name="logo" id="logo" accept="image/*" required
                 onchange="document.getElementById('logoLabel').textContent = this.files[0] ? this.files[0].name : 'Tap to upload team logo';">
          <div class="file-upload-label" id="logoLabel">
            <span class="file-icon">🛡️</span> Tap to upload team logo
          </div>
        </div>
      </div>

      <button type="submit">Register</button>
    </form>

    <a href="/" class="back-link">← Back to Home</a>
  </div>
{% endblock %}
